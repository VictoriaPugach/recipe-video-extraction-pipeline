[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fropti-core-contracts"
version = "1.0.0"
description = "Общий контракт рецептов Fropti"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/fropti-core-contracts/schemas" = ["schemas/recipe-1.0.0.schema.json"]

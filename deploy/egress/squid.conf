# Fropti controlled egress: public HTTP/HTTPS only.
# The API is attached only to the internal Docker network. This proxy is the
# sole service with an external interface; port 3128 is NOT published to host.
http_port 3128

# Only the application subnet may use this proxy.
acl app_net src 172.30.5.0/24
acl localhost src 127.0.0.1/32 ::1
acl manager proto cache_object
acl CONNECT method CONNECT
acl Safe_ports port 80
acl Safe_ports port 443
acl SSL_ports port 443

# dst is a slow ACL: Squid resolves the destination for every new request and
# checks every returned address before connecting. Any blocked address denies
# the request. Redirects and media CDN
# requests therefore pass through the same policy instead of inheriting the
# initial URL check. Keep this deny rule before the final allow.
acl blocked_dst dst 0.0.0.0/8
acl blocked_dst dst 10.0.0.0/8
acl blocked_dst dst 100.64.0.0/10
acl blocked_dst dst 127.0.0.0/8
acl blocked_dst dst 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12
acl blocked_dst dst 192.0.0.0/24
acl blocked_dst dst 192.0.2.0/24
acl blocked_dst dst 192.88.99.0/24
acl blocked_dst dst 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15
acl blocked_dst dst 198.51.100.0/24
acl blocked_dst dst 203.0.113.0/24
acl blocked_dst dst 224.0.0.0/4
acl blocked_dst dst 240.0.0.0/4

# IPv6 unspecified, loopback, IPv4-compatible, special-purpose and local ranges.
acl blocked_dst dst ::/96
acl blocked_dst dst 64:ff9b::/96
acl blocked_dst dst 64:ff9b:1::/48
acl blocked_dst dst 100::/64
acl blocked_dst dst 2001::/23
acl blocked_dst dst 2001:db8::/32
acl blocked_dst dst fc00::/7
acl blocked_dst dst fe80::/10
acl blocked_dst dst ff00::/8

# IPv4-mapped IPv6 forms of non-public IPv4 destinations.
acl blocked_dst dst ::ffff:0.0.0.0/104
acl blocked_dst dst ::ffff:10.0.0.0/104
acl blocked_dst dst ::ffff:100.64.0.0/106
acl blocked_dst dst ::ffff:127.0.0.0/104
acl blocked_dst dst ::ffff:169.254.0.0/112
acl blocked_dst dst ::ffff:172.16.0.0/108
acl blocked_dst dst ::ffff:192.0.0.0/120
acl blocked_dst dst ::ffff:192.0.2.0/120
acl blocked_dst dst ::ffff:192.88.99.0/120
acl blocked_dst dst ::ffff:192.168.0.0/112
acl blocked_dst dst ::ffff:198.18.0.0/111
acl blocked_dst dst ::ffff:198.51.100.0/120
acl blocked_dst dst ::ffff:203.0.113.0/120
acl blocked_dst dst ::ffff:224.0.0.0/100
acl blocked_dst dst ::ffff:240.0.0.0/100

http_access allow localhost manager
http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked_dst
http_access allow app_net
http_access deny all

# Do not retain recipes, media, credentials or URL query strings in proxy logs.
cache deny all
access_log none
cache_log /dev/null
forwarded_for delete
via off
icp_port 0
htcp_port 0
snmp_port 0
shutdown_lifetime 3 seconds
